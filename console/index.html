<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sandbox MCP 控制台</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0d10; --panel:#12161b; --panel2:#171c22; --line:#28313b; --text:#edf3f8; --muted:#91a0ad; --teal:#57d6bd; --blue:#78a9ff; --amber:#f2be64; --red:#ff7b86; --shadow:0 22px 55px rgba(0,0,0,.34); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 9% -5%,rgba(66,171,152,.14),transparent 30%),radial-gradient(circle at 92% 5%,rgba(92,133,224,.13),transparent 28%),var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif; }
    button,input { font:inherit; }
    .shell { width:min(1180px,calc(100% - 36px)); margin:0 auto; padding:42px 0 64px; }
    header { display:flex; justify-content:space-between; gap:28px; align-items:flex-end; margin-bottom:28px; }
    .eyebrow { color:var(--teal); font:700 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:9px 0 5px; font-size:clamp(28px,4vw,46px); letter-spacing:-.04em; line-height:1.05; }
    .subtitle { margin:0; color:var(--muted); max-width:650px; font-size:15px; }
    .refresh { flex:none; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; }
    .card { background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 35%),var(--panel); border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:var(--shadow); }
    .card-head { padding:21px 22px 18px; border-bottom:1px solid var(--line); }
    .title-row { display:flex; justify-content:space-between; gap:16px; align-items:start; }
    h2 { margin:0; font-size:20px; letter-spacing:-.02em; }
    .kind { color:var(--muted); margin-top:3px; }
    .status { display:inline-flex; align-items:center; gap:7px; white-space:nowrap; border:1px solid var(--line); background:#0d1115; border-radius:999px; padding:5px 10px; color:var(--muted); font-size:12px; }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--muted); box-shadow:0 0 0 3px rgba(145,160,173,.08); }
    .status.running { color:var(--teal); border-color:rgba(87,214,189,.3); }
    .status.running .dot { background:var(--teal); box-shadow:0 0 0 3px rgba(87,214,189,.12); }
    .service-actions { display:flex; gap:8px; margin-top:17px; flex-wrap:wrap; }
    button { border:1px solid var(--line); border-radius:9px; color:var(--text); background:#1a2027; padding:8px 12px; cursor:pointer; transition:.15s ease; }
    button:hover:not(:disabled) { border-color:#465564; transform:translateY(-1px); background:#202832; }
    button:disabled { opacity:.45; cursor:wait; }
    button.primary { color:#071411; background:var(--teal); border-color:var(--teal); font-weight:700; }
    button.primary:hover:not(:disabled) { background:#70e1cb; border-color:#70e1cb; }
    button.danger { color:var(--red); background:transparent; }
    button.ghost { background:transparent; }
    .config { margin-top:14px; color:#687784; font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap:anywhere; }
    .section { padding:20px 22px 22px; }
    .section-title { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    h3 { margin:0; font-size:13px; letter-spacing:.01em; }
    .count { color:var(--muted); font:12px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .projects { display:grid; gap:8px; min-height:54px; }
    .project { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; border:1px solid #242c34; border-radius:11px; background:var(--panel2); padding:11px 12px; }
    .project-id { color:var(--blue); font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .project-path { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }
    .remove { padding:5px 8px; font-size:12px; }
    .empty { color:var(--muted); border:1px dashed var(--line); border-radius:11px; padding:15px; text-align:center; }
    .add-box { margin-top:15px; padding-top:16px; border-top:1px solid var(--line); }
    label { display:block; color:var(--muted); font-size:12px; margin-bottom:6px; }
    .path-row { display:flex; gap:8px; }
    input { min-width:0; width:100%; border:1px solid var(--line); border-radius:9px; background:#0d1115; color:var(--text); padding:9px 11px; outline:none; }
    input:focus { border-color:var(--teal); box-shadow:0 0 0 3px rgba(87,214,189,.1); }
    .id-field { margin-top:9px; }
    .add-actions { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:11px; }
    .restart-option { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:12px; }
    .restart-option input { width:auto; }
    .notice { margin-top:20px; border:1px solid rgba(242,190,100,.25); background:rgba(242,190,100,.055); color:#cbbd9d; border-radius:12px; padding:13px 15px; }
    .permission-panel { margin-top:20px; background:linear-gradient(180deg,rgba(120,169,255,.045),transparent 45%),var(--panel); border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:var(--shadow); }
    .permission-head { display:flex; justify-content:space-between; gap:18px; align-items:start; padding:21px 22px 18px; border-bottom:1px solid var(--line); }
    .permission-head p { margin:5px 0 0; color:var(--muted); max-width:720px; }
    .permission-summary { flex:none; color:var(--blue); font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace; white-space:nowrap; }
    .permission-body { padding:18px 22px 22px; }
    .permission-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 18px; }
    .permission-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 10px; border:1px solid #242c34; border-radius:10px; background:var(--panel2); }
    .permission-row input { width:auto; accent-color:var(--teal); }
    .permission-row.locked { opacity:.56; }
    .tool-label { color:var(--text); font-weight:600; }
    .tool-description { color:var(--muted); font-size:12px; margin-top:1px; }
    .tool-state { color:var(--teal); font:11px ui-monospace,SFMono-Regular,Menlo,monospace; white-space:nowrap; }
    .tool-state.off { color:var(--muted); }
    .permission-meta { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:15px; color:#687784; font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; }
    .permission-actions { display:flex; justify-content:flex-end; margin-top:13px; }
    .handoff-panel { margin-top:20px; background:linear-gradient(180deg,rgba(87,214,189,.045),transparent 45%),var(--panel); border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:var(--shadow); }
    .handoff-head { display:flex; justify-content:space-between; gap:18px; align-items:start; padding:21px 22px 18px; border-bottom:1px solid var(--line); }
    .handoff-head p { margin:5px 0 0; color:var(--muted); max-width:720px; }
    .handoff-body { padding:18px 22px 22px; }
    .handoff-list { display:grid; gap:8px; }
    .handoff-row { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:12px; align-items:center; border:1px solid #242c34; border-radius:11px; background:var(--panel2); padding:11px 12px; }
    .handoff-task { color:var(--blue); font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap:anywhere; }
    .handoff-meta { color:var(--muted); font:11px ui-monospace,SFMono-Regular,Menlo,monospace; margin-top:3px; overflow-wrap:anywhere; }
    .handoff-state { color:var(--teal); font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace; white-space:nowrap; }
    .handoff-state.failed,.handoff-state.blocked,.handoff-state.rejected { color:var(--red); }
    .handoff-detail { display:none; margin-top:14px; max-height:320px; overflow:auto; border:1px solid var(--line); border-radius:10px; background:#0d1115; color:#b9c9d5; padding:12px; font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; }
    .handoff-detail.show { display:block; }
    .project-access { display:flex; align-items:center; gap:7px; margin:0; color:var(--muted); font-size:11px; white-space:nowrap; }
    .project-access input { width:auto; accent-color:var(--teal); }
    .project.paused { opacity:.62; }
    .service-note { margin-top:12px; color:#687784; font-size:12px; }
    .toast { position:fixed; left:50%; bottom:24px; z-index:10; transform:translate(-50%,18px); opacity:0; pointer-events:none; max-width:min(620px,calc(100% - 32px)); border:1px solid var(--line); border-radius:11px; background:#182027; box-shadow:var(--shadow); padding:11px 15px; transition:.2s ease; }
    .toast.show { transform:translate(-50%,0); opacity:1; }
    .toast.error { color:#ffd5d9; border-color:rgba(255,123,134,.42); }
    .busy .card { opacity:.72; }
    @media (max-width:820px) { .grid { grid-template-columns:1fr; } header { align-items:start; flex-direction:column; } .refresh { align-self:stretch; } }
    @media (max-width:720px) { .permission-grid { grid-template-columns:1fr; } .permission-head,.handoff-head { flex-direction:column; } .handoff-row { grid-template-columns:1fr; } }
    @media (max-width:520px) { .shell { width:min(100% - 22px,1180px); padding-top:26px; } .path-row { flex-direction:column; } .add-actions { align-items:stretch; flex-direction:column; } .add-actions button { width:100%; } .permission-row { grid-template-columns:auto minmax(0,1fr); } .tool-state { grid-column:2; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">Local control plane</div>
        <h1>Sandbox MCP 控制台</h1>
        <p class="subtitle">管理两个独立服务的项目范围、工具权限和运行状态。保存配置默认不重启服务；需要立即应用时请明确选择重启。</p>
      </div>
      <button class="refresh ghost" id="refresh">刷新状态</button>
    </header>
    <section class="grid" id="profiles" aria-live="polite"></section>
    <section class="permission-panel" id="permission-panel" aria-live="polite"></section>
    <section class="handoff-panel" id="handoff-panel" aria-live="polite"></section>
    <div class="notice">安全边界：只读入口只开放读取工具，项目必须为 read_only；编码工作台仍由其独立部署配置管理，拥有文件写入和命令执行能力。只读项目仍拒绝开放整个 Home、Desktop、Downloads 和符号链接根目录。编码工作台的本机用户模式不受项目目录限制。</div>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const TOKEN = "__SANDBOX_CONSOLE_TOKEN__";
    const labels = { readonly: { accent: "只读", add: "加入只读范围" }, coding: { accent: "可编辑 / 可执行命令", add: "加入编码范围" } };
    let state = null;
    let busy = false;

    const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
    const toast = (message, error = false) => {
      const node = document.getElementById("toast");
      node.textContent = message; node.className = `toast show${error ? " error" : ""}`;
      clearTimeout(toast.timer); toast.timer = setTimeout(() => node.className = "toast", 4200);
    };
    async function api(url, options = {}) {
      const response = await fetch(url, { ...options, headers: { "content-type": "application/json", "x-console-token": TOKEN, ...(options.headers || {}) } });
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || `请求失败 (${response.status})`);
      return data;
    }
    function serviceText(service) {
      if (service.error) return "状态未确认";
      if (service.state === "unsupported") return "此平台不支持服务管理";
      if (service.running) return `运行中${service.pid ? ` · PID ${service.pid}` : ""}`;
      if (["spawn scheduled", "waiting", "starting"].includes(service.state)) return "正在启动";
      if (service.loaded) return service.state || "已载入";
      return service.installed ? "已停止" : "未安装";
    }
    function card(profile, data) {
      const service = data.service;
      const hostMode = profile === "coding" && data.accessMode === "host_user";
      const configError = data.configError ? `<div class="notice error">配置不可用：${escapeHtml(data.configError)}</div>` : "";
      const projects = data.projects.map(project => {
        const enabled = project.enabled !== false;
        return `
        <div class="project${enabled ? "" : " paused"}">
          <div><div class="project-id">${escapeHtml(project.id)}</div><div class="project-path" title="${escapeHtml(project.root)}">${escapeHtml(project.root)}</div></div>
          <div class="project-access"><label><input type="checkbox" data-enabled-profile="${profile}" data-enabled-id="${escapeHtml(project.id)}" ${enabled ? "checked" : ""}> ${enabled ? "已开放" : "已暂停"}</label><button class="remove danger" data-remove="${profile}" data-id="${escapeHtml(project.id)}">移除</button></div>
        </div>`;
      }).join("") || '<div class="empty">还没有可见项目</div>';
      return `<article class="card" data-profile="${profile}">
        <div class="card-head">
          <div class="title-row"><div><h2>${escapeHtml(data.title)}</h2><div class="kind">${escapeHtml(data.kind)} · ${labels[profile].accent}</div></div><div class="status ${service.running ? "running" : ""}"><span class="dot"></span>${escapeHtml(serviceText(service))}</div></div>
          <div class="service-actions"><button class="primary" data-service="start" data-profile="${profile}" ${!service.installed || service.supported === false || service.error ? "disabled" : ""}>启动</button><button data-service="restart" data-profile="${profile}" ${!service.installed || service.supported === false || service.error ? "disabled" : ""}>重启</button><button class="ghost" data-service="stop" data-profile="${profile}" ${!service.loaded || service.supported === false || service.error ? "disabled" : ""}>停止</button></div>
          ${service.error ? `<div class="notice error">${escapeHtml(service.error)}</div>` : !service.installed ? `<div class="service-note">先在终端使用 sandbox-mcp service install ${profile} 显式安装服务；本控制台不创建隧道或读取凭据。</div>` : ""}
          <div class="config" title="${escapeHtml(data.configPath)}">配置：${escapeHtml(data.configPath)}</div>
          ${profile === "coding" ? `<div class="service-note">${hostMode ? "本机用户权限：可读写本机文件、运行终端命令和管理进程。通过下方服务按钮启动或停止访问。" : "此服务的工具模式来自独立部署配置；本控制台管理它的项目根目录与 LaunchAgent。"}</div>` : ""}
        </div>
        ${hostMode ? '<div class="section"><h3>本机文件与终端</h3><p>无需添加项目目录。访问受 macOS 当前用户权限约束；普通 Sandbox MCP 的只读规则保持独立。</p></div>' : `<div class="section">
          <div class="section-title"><h3>项目可见范围</h3><span class="count">${data.projects.length} PROJECTS</span></div>
          ${configError}<div class="projects">${projects}</div>
          <div class="add-box">
            <label for="path-${profile}">项目目录</label>
            <div class="path-row"><input id="path-${profile}" placeholder="/Users/you/Desktop/project" autocomplete="off"><button data-pick="${profile}">选择文件夹</button></div>
            ${profile === "readonly" ? `<div class="id-field"><label for="id-${profile}">项目 ID（可选）</label><input id="id-${profile}" placeholder="自动从文件夹名称生成" autocomplete="off"></div>` : ""}
            <div class="add-actions"><label class="restart-option"><input type="checkbox" id="restart-${profile}"> 保存后重启正在运行的服务</label><button class="primary" data-add="${profile}">${labels[profile].add}</button></div>
          </div>
        </div>`}
      </article>`;
    }
    function permissionPanel(data) {
      if (!data?.available) return `<div class="permission-head"><div><h2>工具权限</h2><p>权限配置不可用，MCP 将无法确认可暴露的工具。</p></div><div class="permission-summary">UNAVAILABLE</div></div><div class="permission-body"><div class="notice">${escapeHtml(data?.error || "未知权限配置错误")}</div></div>`;
      const readTools = data.tools.filter(tool => tool.group === "read");
      const writeTools = data.tools.filter(tool => tool.group === "write");
      const rows = tool => `<div class="permission-row${tool.locked ? " locked" : ""}">
        <input type="checkbox" data-permission="${escapeHtml(tool.name)}" ${tool.configured ? "checked" : ""} ${tool.locked ? "disabled" : ""} aria-label="${escapeHtml(tool.label)}">
        <div><div class="tool-label">${escapeHtml(tool.label)}</div><div class="tool-description">${escapeHtml(tool.description)}</div></div>
        <div class="tool-state ${tool.effective ? "" : "off"}">${tool.effective ? "已配置" : tool.locked_reason || "已关闭"}</div>
      </div>`;
      return `<div class="permission-head"><div><h2>Sandbox MCP 工具权限</h2><p>控制只读 MCP 的工具暴露面。配置在下次启动或明确重启后生效；已加载的策略同时约束 <code>tools/list</code> 和 <code>tools/call</code>。</p></div><div class="permission-summary">${data.effective_count}/${data.tools.length} CONFIGURED</div></div>
        <div class="permission-body"><div class="section-title"><h3>读取能力</h3><span class="count">${readTools.filter(tool => tool.effective).length}/${readTools.length} ENABLED</span></div><div class="permission-grid">${readTools.map(rows).join("")}</div>
        <div class="section-title" style="margin-top:20px"><h3>写入能力</h3><span class="count">SECOND GATE</span></div><div class="permission-grid">${writeTools.map(rows).join("")}</div>
        <div class="permission-meta"><span>配置：${escapeHtml(data.config_path)}</span><span>策略哈希：${escapeHtml(data.config_hash)}</span></div>
        <div class="permission-actions"><label class="restart-option"><input type="checkbox" id="restart-permissions"> 保存后重启正在运行的服务</label></div></div>`;
    }
    function handoffPanel(data) {
      if (!data?.available) return `<div class="handoff-head"><div><h2>Web 只读结果</h2><p>本地 handoff 状态不可用。</p></div></div><div class="handoff-body"><div class="notice error">${escapeHtml(data?.error || "未知 handoff 状态错误")}</div></div>`;
      const tasks = data.tasks || [];
      const rows = tasks.map(task => {
        const status = task.status || "unknown";
        const snapshot = task.snapshot_id || "no snapshot";
        return `<div class="handoff-row"><div><div class="handoff-task">${escapeHtml(task.task_id)}</div><div class="handoff-meta">${escapeHtml(snapshot)} · ${escapeHtml(task.repository || "unknown repository")}</div></div><div class="handoff-state ${escapeHtml(status)}">${escapeHtml(status)}</div><button class="ghost" data-handoff-receipt="${escapeHtml(task.task_id)}">查看 receipt</button></div>`;
      }).join("") || '<div class="empty">还没有导入的任务契约</div>';
      return `<div class="handoff-head"><div><h2>Web 只读结果</h2><p>这里只读取本地 snapshot、validation、receipt 和 diff 结果；Web 端没有 execute、approve、reject、merge 或 push 操作。</p></div><div class="permission-summary">${tasks.length} TASKS</div></div><div class="handoff-body"><div class="handoff-list">${rows}</div><pre class="handoff-detail" id="handoff-detail"></pre></div>`;
    }
    function render() {
      document.getElementById("profiles").innerHTML = Object.entries(state.profiles).map(([profile, data]) => card(profile, data)).join("");
      document.getElementById("permission-panel").innerHTML = permissionPanel(state.permissions);
      document.getElementById("handoff-panel").innerHTML = handoffPanel(state.handoff);
      document.body.classList.toggle("busy", busy);
      document.querySelectorAll("button, input[type=checkbox]").forEach(control => control.disabled = busy || control.disabled);
    }
    async function refresh() {
      try { state = await api("/api/state"); render(); }
      catch (error) { toast(error.message, true); }
    }
    async function action(work, success) {
      if (busy) return;
      busy = true; render();
      try {
        const result = await work();
        state = result; render();
        toast(result.restartWarning || success, Boolean(result.restartWarning));
      } catch (error) { await refresh(); toast(error.message, true); }
      finally { busy = false; render(); }
    }
    document.addEventListener("click", event => {
      const button = event.target.closest("button"); if (!button) return;
      if (button.id === "refresh") { refresh(); return; }
      if (button.dataset.handoffReceipt) {
        const detail = document.getElementById("handoff-detail");
        fetch(`/api/handoff/${encodeURIComponent(button.dataset.handoffReceipt)}/receipt`).then(response => response.json()).then(data => {
          if (!data.ok) throw new Error(data.error || "读取 receipt 失败");
          detail.textContent = JSON.stringify(data, null, 2); detail.classList.add("show");
        }).catch(error => toast(error.message, true));
        return;
      }
      if (button.dataset.service) {
        const { profile, service: serviceAction } = button.dataset;
        action(() => api("/api/service", { method:"POST", body:JSON.stringify({ profile, action:serviceAction }) }), `${state.profiles[profile].title} 已${serviceAction === "stop" ? "停止" : serviceAction === "restart" ? "重启" : "启动"}`);
      }
      if (button.dataset.pick) {
        const profile = button.dataset.pick;
        if (busy) return;
        busy = true; render();
        api("/api/pick-folder", { method:"POST", body:"{}" }).then(picked => {
          busy = false; render();
          document.getElementById(`path-${profile}`).value = picked.path;
          toast("已选择项目目录");
        }).catch(error => { busy = false; render(); toast(error.message, true); });
      }
      if (button.dataset.add) {
        const profile = button.dataset.add;
        const projectPath = document.getElementById(`path-${profile}`).value;
        const id = profile === "readonly" ? document.getElementById(`id-${profile}`).value : undefined;
        const restart = document.getElementById(`restart-${profile}`).checked;
        action(() => api("/api/projects/add", { method:"POST", body:JSON.stringify({ profile, path:projectPath, id, restart }) }), "项目范围已更新");
      }
      if (button.dataset.remove) {
        const profile = button.dataset.remove, id = button.dataset.id;
        const project = state.profiles[profile].projects.find(item => item.id === id);
        if (!confirm(`从 ${state.profiles[profile].title} 移除？\n\n${project?.root || id}\n\n不会删除项目文件。`)) return;
        const restart = document.getElementById(`restart-${profile}`).checked;
        action(() => api("/api/projects/remove", { method:"POST", body:JSON.stringify({ profile, id, restart }) }), "项目已从可见范围移除");
      }
    });
    document.addEventListener("change", event => {
      const control = event.target;
      if (control.matches("input[data-permission]")) {
        const restart = document.getElementById("restart-permissions")?.checked ?? false;
        action(() => api("/api/permissions/tool", { method:"POST", body:JSON.stringify({ profile:"readonly", tool:control.dataset.permission, enabled:control.checked, restart }) }), "工具权限已更新");
      }
      if (control.matches("input[data-enabled-profile]")) {
        const profile = control.dataset.enabledProfile;
        const restart = document.getElementById(`restart-${profile}`)?.checked ?? false;
        action(() => api("/api/projects/set-enabled", { method:"POST", body:JSON.stringify({ profile, id:control.dataset.enabledId, enabled:control.checked, restart }) }), control.checked ? "项目已恢复开放" : "项目已暂停开放");
      }
    });
    refresh();
    setInterval(() => {
      if (busy || !state) return;
      const transitioning = Object.values(state.profiles).some(profile => profile.service.loaded && !profile.service.running && profile.service.state !== "stopped");
      if (transitioning) refresh();
    }, 3000);
  </script>
</body>
</html>
