<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandbox Monitor</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f7;--panel:#fff;--line:#e5e9e8;--ink:#1c2925;--muted:#73817b;--green:#247c64;--soft:#e7f4ed;--danger:#b64e43;--warn:#b88a28;font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#151a19;--panel:#1d2522;--line:#33413b;--ink:#edf3ee;--muted:#9aaca2;--green:#8ad3b4;--soft:#263d31;--danger:#ffaaa0;--warn:#f1cc70}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);margin:0}
button{font:inherit;cursor:pointer}
main{max-width:990px;margin:auto;padding:20px 22px 13px}
header{display:flex;align-items:center;gap:12px;margin-bottom:15px}
.logo{display:grid;place-items:center;flex:none;width:37px;height:37px;border-radius:11px;background:var(--soft);color:var(--green);font-weight:800;font-size:18px}
.heading{flex:1;min-width:0}
h1{font-size:18px;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);font-size:11px}
.live{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:6px 10px;font-size:11px;color:var(--muted);white-space:nowrap}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.live.connected .dot{background:var(--green)}
.live.failed .dot{background:var(--danger)}
.summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:12px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-width:0}
.metric-label{font-size:11px;color:var(--muted)}
.metric-value{font-size:20px;font-weight:680;line-height:1.3;margin-top:5px;font-variant-numeric:tabular-nums}
.metric-value.small{font-size:13px;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden}
.toolbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar strong{font-size:13px}
.toolbar .spacer{flex:1}
.filter{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.filter button{background:none;border:0;border-radius:6px;color:var(--muted);padding:5px 9px;font-size:11px}
.filter button[aria-pressed=true]{background:var(--panel);color:var(--ink);font-weight:650}
.refresh{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.activity{height:270px;overflow:auto;padding:0 14px}
.event{display:grid;grid-template-columns:58px 13px minmax(0,1fr) auto;align-items:start;column-gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.time{color:var(--muted);font:11px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.mark{width:7px;height:7px;border-radius:50%;background:#a0b2a9;margin-top:6px}
.mark.error{background:var(--danger)}.mark.publish{background:var(--green)}
.event-title{font-weight:610;font-size:12px;overflow-wrap:anywhere}
.event-description{color:var(--muted);font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px;max-width:100%}
.event-status{color:var(--muted);font-size:11px;white-space:nowrap}
.event-status.error{color:var(--danger)}.event-status.ok{color:var(--green)}
.empty{color:var(--muted);padding:48px 20px;text-align:center;font-size:12px}
footer{padding:12px 2px 0;color:var(--muted);font-size:11px}
@media(max-width:650px){.summary{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:540px){main{padding:12px} .summary{gap:6px}.metric{padding:9px}.metric-value{font-size:19px}.event{grid-template-columns:48px 10px minmax(0,1fr) auto;gap:6px}.activity{height:290px}.toolbar{gap:7px}.filter button{padding:5px 7px}}
</style>
</head>
<body>
<main>
<header>
  <div class="logo" aria-hidden="true">◎</div>
  <div class="heading"><h1>Sandbox Monitor</h1><div class="sub">ChatGPT Activity · 只读本机检测台</div></div>
  <div id="connection" class="live"><span class="dot"></span><span id="connection-text">正在读取本地事件</span></div>
</header>
<div class="summary">
  <div class="metric"><div class="metric-label">MCP 调用</div><div class="metric-value" id="tool-count">0</div></div>
  <div class="metric"><div class="metric-label">未见完成</div><div class="metric-value" id="pending-count">0</div></div>
  <div class="metric"><div class="metric-label">调用失败</div><div class="metric-value" id="error-count">0</div></div>
  <div class="metric"><div class="metric-label">MCP P50 耗时</div><div class="metric-value small" id="latency">—</div></div>
  <div class="metric" title="普通 Chat 不向此插件提供输入、输出或推理 token 统计；不能推算真实消耗"><div class="metric-label">实际 Token 用量</div><div class="metric-value small" id="token-usage">不可获取</div></div>
</div>
<section class="panel">
  <div class="toolbar">
    <strong>事件时间线</strong><span class="sub" id="event-meta">仅 MCP 与显式发布 · 暂无事件</span>
    <div class="spacer"></div>
    <div class="filter" aria-label="事件过滤">
      <button type="button" data-filter="all" aria-pressed="true">全部</button>
      <button type="button" data-filter="tool" aria-pressed="false">工具</button>
      <button type="button" data-filter="published" aria-pressed="false">公开阶段</button>
      <button type="button" data-filter="error" aria-pressed="false">异常</button>
    </div>
    <button type="button" class="refresh" id="refresh">刷新</button>
  </div>
  <div class="activity" id="activity" role="log" aria-label="MCP 事件列表"><div class="empty">尚无监测事件。请在 ChatGPT 网页使用 Sandbox MCP for test。</div></div>
</section>
<footer>仅记录 Sandbox MCP for test 的请求及 Chat 明确发布的公开阶段/思路概要，不读取内部思考。耗时为 MCP 调用时长，不是模型思考时长。普通 Chat 的实际 Token 用量不可获取；此窗口不调用模型或执行操作。</footer>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const token = new URLSearchParams(location.hash.slice(1)).get('token');
  history.replaceState(null, '', location.pathname);
  const seen = new Set(), events = [];
  let cursor = '', filter = 'all', fetching = false, alive = true;
  const sourceNames = { chat_mcp:'Chat · MCP', local_app:'本机旧记录' };
  const kindNames = { request:'任务', approach:'公开思路概要', progress:'阶段进度', final:'最终结论', note:'备注' };
  function shortTime(value) {
    const d = new Date(value);
    return Number.isFinite(d.getTime()) ? d.toLocaleTimeString('zh-CN',{hour12:false}) : '—';
  }
  function status(text, level='') {
    $('connection').className = 'live ' + level;
    $('connection-text').textContent = text;
  }
  function groupEvents() {
    const rows = [], started = new Map();
    for (const event of events) {
      if (event.kind === 'tool' && event.operation && event.status === 'started') {
        const row = { ...event };
        rows.push(row);
        started.set(event.operation, row);
      } else if (event.kind === 'tool' && event.operation && started.has(event.operation)) {
        const row = started.get(event.operation);
        row.status = event.status;
        row.duration_ms = event.duration_ms;
        row.finished_at = event.at;
        started.delete(event.operation);
      } else {
        rows.push(event);
      }
    }
    return rows;
  }
  function elapsed(ms) {
    return ms < 1000 ? Math.round(ms) + ' ms' : (ms / 1000).toFixed(1) + ' s';
  }
  function render() {
    const rows = groupEvents();
    const tools = rows.filter(e => e.kind === 'tool');
    const completed = tools.filter(e => e.status !== 'started');
    const timings = completed.map(e => e.duration_ms).filter(n => Number.isFinite(n) && n >= 0).sort((a,b)=>a-b);
    const p50 = timings.length ? timings[Math.floor((timings.length-1)/2)] : null;
    $('tool-count').textContent = String(tools.length);
    $('pending-count').textContent = String(tools.filter(e => e.status === 'started').length);
    $('error-count').textContent = String(completed.filter(e => e.status === 'error').length);
    $('latency').textContent = p50 === null ? '—' : elapsed(p50);
    const sharedChars = rows.filter(e => e.kind !== 'tool').reduce((sum,e)=>sum+(e.text?.length||0),0);
    $('event-meta').textContent = (events.length ? '最近 ' + shortTime(events.at(-1).at) : '暂无事件') +
      ' · 已共享 ' + sharedChars + ' 字符（不是 Token）';
    const entries = rows.filter(e => {
      if (filter === 'tool') return e.kind === 'tool';
      if (filter === 'published') return e.kind !== 'tool';
      if (filter === 'error') return e.kind === 'tool' && e.status === 'error';
      return true;
    });
    const area = $('activity');
    area.replaceChildren();
    if (!entries.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = filter === 'all' ? '尚无记录到的 MCP 活动。' : '当前分类没有事件。';
      area.append(empty);
      return;
    }
    const fragment = document.createDocumentFragment();
    for (const e of [...entries].reverse().slice(0,120)) {
      const row = document.createElement('div'); row.className = 'event';
      const time = document.createElement('time'); time.className='time'; time.textContent = shortTime(e.at);
      const mark = document.createElement('span'); mark.className = 'mark' + (e.status==='error'?' error': e.kind!=='tool'?' publish':'');
      const description = document.createElement('div');
      const title = document.createElement('div'); title.className = 'event-title';
      title.textContent = e.kind === 'tool' ? (e.name || '未命名工具') : (kindNames[e.kind] || '共享信息');
      const details = document.createElement('div'); details.className = 'event-description';
      if (e.kind === 'tool') {
        const source = sourceNames[e.source] || e.source || 'MCP';
        const interval = Number.isFinite(e.duration_ms) ? ' · MCP 耗时 ' + elapsed(e.duration_ms)
          : e.status === 'started' ? ' · 已等待约 ' + elapsed(Math.max(0,Date.now()-new Date(e.at).getTime())) : '';
        details.textContent = source + interval;
      } else {
        details.textContent = e.text || '';
      }
      description.append(title, details);
      const state = document.createElement('span');
      state.className = 'event-status' + (e.status==='error'?' error':e.status==='ok'?' ok':'');
      state.textContent = e.kind !== 'tool' ? '已共享' : e.status==='ok' ? '调用成功'
        : e.status==='error' ? '调用失败' : e.status === 'started' ? '未见完成' : (e.status || '未知');
      row.append(time,mark,description,state);
      fragment.append(row);
    }
    area.append(fragment);
  }
  async function poll() {
    if (fetching || !alive) return;
    fetching = true;
    try {
      if (!token) throw new Error('缺少本地会话凭证，请重新打开 App');
      const response = await fetch('/api/sync?after=' + encodeURIComponent(cursor), {
        cache:'no-store',
        headers: { 'x-local-workbench-token': token }
      });
      if (!response.ok) throw new Error('本地事件接口 ' + response.status);
      const data = await response.json();
      let changed = false;
      for (const event of data.events || []) {
        if (!event || typeof event.id !== 'string' || seen.has(event.id)) continue;
        seen.add(event.id); events.push(event); changed = true;
      }
      while (events.length > 220) { const old = events.shift(); seen.delete(old.id); }
      cursor = data.cursor || cursor;
      render(); // Update elapsed time for requests with no completion event.
      status('本机事件可读', 'connected');
    } catch (error) {
      status('读取失败：' + error.message, 'failed');
    } finally {
      fetching = false;
      if (alive) setTimeout(poll,2000);
    }
  }
  for (const button of document.querySelectorAll('[data-filter]')) {
    button.addEventListener('click', () => {
      filter = button.dataset.filter;
      for (const option of document.querySelectorAll('[data-filter]')) {
        option.setAttribute('aria-pressed',String(option === button));
      }
      render();
    });
  }
  $('refresh').addEventListener('click',poll);
  window.addEventListener('pagehide',()=>{ alive=false; });
  poll();
})();
</script>
</body>
</html>
